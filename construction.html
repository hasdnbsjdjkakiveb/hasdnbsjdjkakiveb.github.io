<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>We're Redeveloping</title>
  <link rel="stylesheet" href="construction.css" />
</head>
<body>
  <div class="container">
    <img src="assets/webelo.png" alt="Webelo Designs Logo" class="logo" />
    <h1 class="fade-in">We're Redeveloping Our Website</h1>
    <p class="fade-in delay">Something amazing is on the way. Come back soon to see the brand new Webelo Designs experience!</p>
    <p class="fade-in delay">Estimated relaunch at <strong>3:00 PM MST, June 9th</strong></p>
<p class="fade-in delay">Time remaining:</p>
<h2 id="countdown" class="countdown fade-in delay"></h2>
  </div>

  <script>
  const countdownEl = document.getElementById("countdown");

  const launchMST = new Date("2025-06-09T15:00:00-07:00");

  function updateCountdown() {
    const now = new Date();
    const diff = launchMST - now;

    if (diff <= 0) {
      countdownEl.innerText = "Launching now!";
      return;
    }

    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    countdownEl.innerText = `${hours}h ${minutes}m ${seconds}s`;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
